<script>
  // boot: render shell → auth (best effort) → route
  (function () {
    var fab = document.getElementById('hubFab');
    if (fab) fab.classList.add('show');
    DGX.boot().then(function () {
      if (fab) fab.classList.toggle('show', location.hash.indexOf('#/product') !== 0 &&
                                            location.hash.indexOf('#/agent') !== 0);
      // demo mode (only with ?demo=1): the local/dev server exposes APP_DEV_LOGIN,
      // so we can sign in as the seeded demo account to explore logged-in pages.
      if (!DGX.isLoggedIn && /[?&]demo=1/.test(location.search)) {
        fetch('/api/app/auth', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: '10' })
        }).then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            if (!d || !d.token) return;
            localStorage.setItem('dgx_token', d.token);
            location.reload();
          }).catch(function () {});
      }
    });
    // keep the FAB in sync with routing
    window.addEventListener('hashchange', function () {
      if (!fab) return;
      var h = location.hash;
      fab.classList.toggle('show', h.indexOf('#/product') !== 0 && h.indexOf('#/agent') !== 0);
    });
    // PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    }
  })();
</script>
